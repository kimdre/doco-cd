# Minimal anonymous git smart-HTTP server: every request goes to
# git-http-backend, which serves the bare repos under /repos read-only
# (fetch/clone only, pushes happen on the host filesystem directly).
#
# It also stands in for the Apprise API: POST /notify is answered 200 and
# its body is written to the container log, one JSON document per line.
pid /run/nginx.pid;

events {}

http {
    access_log off;

    # $request_body is only filled once proxy_pass reads the body into memory.
    log_format notify escape=json '$request_body';

    server {
        listen 80;

        location = /notify {
            access_log /dev/stdout notify;
            client_body_buffer_size 1m;
            client_body_in_single_buffer on;
            proxy_pass http://127.0.0.1:8081/;
        }

        location / {
            fastcgi_pass unix:/run/fcgiwrap.sock;
            fastcgi_param SCRIPT_FILENAME /usr/libexec/git-core/git-http-backend;
            fastcgi_param GIT_PROJECT_ROOT /repos;
            fastcgi_param GIT_HTTP_EXPORT_ALL "";
            fastcgi_param PATH_INFO $uri;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
            fastcgi_param REMOTE_ADDR $remote_addr;
        }
    }

    server {
        listen 127.0.0.1:8081;

        location / {
            return 200 '{}';
        }
    }
}
