# The e2e harness: a local git server and a doco-cd daemon built from the
# working tree. Deployed stacks land on the same docker the harness runs on,
# so assertions are plain `docker` commands from the host.
services:
  gitserver:
    build: gitserver
    container_name: doco-e2e-gitserver
    volumes:
      - ../.work/repos:/repos:ro

  doco-cd:
    build:
      context: ../../..
      args:
        DISABLE_BITWARDEN: "true" # not exercised by e2e, skipping it halves the build
    container_name: doco-e2e-daemon
    depends_on:
      - gitserver
    environment:
      TZ: Etc/UTC
      LOG_LEVEL: debug
      POLL_CONFIG_FILE: /config/poll.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../.work/poll.yaml:/config/poll.yaml:ro
      - data:/data
    healthcheck:
      test: ["CMD", "/doco-cd", "healthcheck"]
      start_period: 5s
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  data:
