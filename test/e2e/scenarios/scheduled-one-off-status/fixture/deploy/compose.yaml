services:
  app:
    image: alpine:3.22
    command: ["sh", "-c", "trap 'exit 0' TERM; while :; do sleep 1; done"]
    volumes:
      - job-state:/state

  backup:
    image: alpine:3.22
    command: ["sh", "-c", "test -f /state/ready || exit 7; sleep 5"]
    restart: "no"
    volumes:
      - job-state:/state
    labels:
      cd.doco.job.enabled: "true"
      cd.doco.job.schedule: "@every 1m"
      cd.doco.job.execution_mode: "one_off"
      cd.doco.job.skip_running: "true"
      cd.doco.job.notify_on: "none"

volumes:
  job-state:
