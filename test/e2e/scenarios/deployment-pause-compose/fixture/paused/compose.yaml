services:
  app:
    image: alpine:3.22
    command: ["tail", "-f", "/dev/null"]
    restart: unless-stopped
    environment:
      VERSION: "1"

  backup:
    image: alpine:3.22
    command: ["true"]
    restart: "no"
    labels:
      cd.doco.job.enabled: "true"
      cd.doco.job.schedule: "@every 3s"
      cd.doco.job.execution_mode: "one_off"
      cd.doco.job.skip_running: "true"
      cd.doco.job.notify_on: "none"
