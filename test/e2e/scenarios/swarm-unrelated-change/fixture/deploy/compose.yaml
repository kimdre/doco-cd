services:
  app:
    image: alpine:3.22
    init: true
    command: ["sleep", "600"]
    volumes:
      - data:/data
  static:
    image: alpine:3.22
    init: true
    command: ["sleep", "600"]
    volumes:
      - ./static:/static:ro
  changed:
    image: alpine:3.22
    init: true
    command: ["sleep", "600"]
    environment:
      VERSION: "1"

volumes:
  data:
