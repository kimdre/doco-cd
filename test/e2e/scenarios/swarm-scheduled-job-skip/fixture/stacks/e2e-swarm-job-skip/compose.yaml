services:
  app:
    image: alpine:3.22
    command: ["sh", "-c", "trap 'exit 0' TERM; while :; do sleep 1; done"]

  # doco-cd deploys this restart-mode job at 0 replicas. A run scales it to 1.
  job:
    image: alpine:3.22
    command: ["sh", "-c", "trap 'exit 0' TERM; while :; do sleep 1; done"]
    labels:
      cd.doco.job.enabled: "true"
      cd.doco.job.schedule: "@every 24h"
      cd.doco.job.execution_mode: "restart"
      cd.doco.job.notify_on: "none"
