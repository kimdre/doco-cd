# doco-cd itself. This file lives on the host (e.g. /opt/doco-cd/), NOT in
# the app repo because the controller cannot GitOps itself.
#
# The Doco-CD controller uses polling and publishes no ports. The deployed
# example app has a separate Caddy service that publishes ports 80 and 443.
services:
  doco-cd:
    image: ghcr.io/kimdre/doco-cd:latest # pin tag+digest in real use
    restart: unless-stopped
    # secrets.env stays on the host, never in Git. PASS_ENV forwards all of
    # this container's environment into deployment Compose interpolation; only
    # use it with trusted deployment repositories.
    env_file:
      - secrets.env
    environment:
      TZ: Etc/UTC
      POLL_CONFIG_FILE: /etc/doco-cd/poll.yaml
      PASS_ENV: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./poll.yaml:/etc/doco-cd/poll.yaml:ro
      - data:/data
    healthcheck: # runs the image's built-in /healthcheck command
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  data:
