# Included by both envs at a pinned sha, so each env can sit on a different revision.
# After editing, bump DB_COMPOSE_SHA in the envs you want it on.
services:
  db:
    image: postgres:${POSTGRES_TAG}
    restart: unless-stopped
    env_file:
      - ./env/db.env
      - ./secrets/db.sops.env
    volumes:
      - /data/db:/var/lib/postgresql/data   # absolute: doco-cd never creates host paths
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 3
