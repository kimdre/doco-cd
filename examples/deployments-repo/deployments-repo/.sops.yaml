# Every */secrets/*.sops.env is encrypted to this age recipient. The matching PRIVATE
# key sits on each host next to the daemon (server/compose.yaml, SOPS_AGE_KEY_FILE).
# Generate: age-keygen -o age.key. Cloud KMS works the same way.
creation_rules:
  - path_regex: .*/secrets/.*\.sops\.env$
    age: age1qyqszqgpqyqszqgpqyqszqgpqyqszqgpqyqszqgpqyqszqgpqyqs3wkdge # replace with YOUR public key
